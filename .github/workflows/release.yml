name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build executables with PyInstaller
        run: pyinstaller --clean --noconfirm AutoClickerPro.spec

      - name: Package Instant-Start (onedir) ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AutoClickerPro/*" -DestinationPath "dist/AutoClickerPro-InstantStart-win64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## ⚡ AutoClicker Pro — Windows Release

            ### Downloads
            - **`AutoClickerPro-Portable.exe`** — Single standalone executable (no extraction required).
            - **`AutoClickerPro-InstantStart-win64.zip`** — Recommended for instant `<0.5s` startup (extract and run `AutoClickerPro.exe`).

            ### Highlights
            - Modern Slate & Electric Blue dark UI with Quick CPS Presets & live CPS badge
            - Multi-monitor Image Search with built-in **✂️ Screen Snip** overlay, **`Ctrl+V` clipboard paste**, and **auto-return mouse cursor**
            - Visual Workflow Builder with drag-and-drop playlist & **Gemini 2.5 Flash AI Agent**
            - Drift-free Macro Recorder with 125Hz mouse move coalescing & Global Smart Move
          files: |
            dist/AutoClickerPro-Portable.exe
            dist/AutoClickerPro-InstantStart-win64.zip
